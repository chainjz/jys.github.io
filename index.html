<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f0">
  <title>开发计划 · 项目进度</title>
  <style>
    :root {
      --paper: #f4f5f0;
      --paper-deep: #e9ece5;
      --ink: #17201d;
      --ink-soft: #58625d;
      --ink-faint: #8a948f;
      --line: rgba(23, 32, 29, 0.13);
      --line-strong: rgba(23, 32, 29, 0.24);
      --surface: rgba(255, 255, 252, 0.72);
      --white: #fffef9;
      --brand: #185f52;
      --brand-deep: #0d473e;
      --accent: #df6a42;
      --blue: #3b659b;
      --amber: #a17124;
      --violet: #71608c;
      --olive: #6d7044;
      --shadow: 0 24px 70px rgba(39, 52, 46, 0.09);
      --radius: 18px;
      --nav-height: 76px;
      --sans: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      --serif: "Source Han Serif SC", "Noto Serif CJK SC", "STZhongsong", "SimSun", serif;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        linear-gradient(rgba(23, 32, 29, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 32, 29, 0.025) 1px, transparent 1px),
        radial-gradient(circle at 84% 4%, rgba(223, 106, 66, 0.1), transparent 27rem),
        var(--paper);
      background-size: 32px 32px, 32px 32px, auto, auto;
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      background: linear-gradient(115deg, transparent 0 67%, rgba(24, 95, 82, 0.035) 67% 68%, transparent 68%);
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    a {
      color: inherit;
    }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 100;
      padding: 10px 14px;
      color: var(--white);
      background: var(--ink);
      border-radius: 8px;
      transform: translateY(-150%);
      transition: transform 180ms ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .shell {
      width: min(1260px, calc(100% - 64px));
      margin-inline: auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: var(--nav-height);
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(244, 245, 240, 0.74);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      backdrop-filter: blur(20px) saturate(150%);
      box-shadow: 0 1px 0 rgba(23, 32, 29, 0.08);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      gap: 26px;
      min-height: var(--nav-height);
    }

    .brand {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      color: var(--white);
      background: var(--ink);
      border-radius: 9px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .brand-mark svg {
      width: 18px;
      height: 18px;
    }

    .brand-name {
      display: flex;
      flex-direction: column;
      line-height: 1.12;
    }

    .brand-name strong {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-name span {
      margin-top: 4px;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .nav-rail {
      display: flex;
      flex: 1 1 auto;
      gap: 3px;
      min-width: 0;
      padding: 5px;
      overflow-x: auto;
      border: 1px solid rgba(23, 32, 29, 0.09);
      border-radius: 11px;
      background: rgba(255, 255, 252, 0.46);
      scrollbar-width: none;
    }

    .nav-rail::-webkit-scrollbar {
      display: none;
    }

    .nav-item {
      position: relative;
      flex: 0 0 auto;
      padding: 9px 13px;
      color: var(--ink-soft);
      border: 0;
      border-radius: 7px;
      background: transparent;
      font-size: 13px;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition: color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .nav-item:hover {
      color: var(--ink);
      background: rgba(255, 255, 252, 0.78);
    }

    .nav-item:active {
      transform: translateY(1px);
    }

    .nav-item[aria-current="page"] {
      color: var(--white);
      background: var(--ink);
    }

    .nav-item:focus-visible,
    .brand:focus-visible,
    .entry-link:focus-visible,
    .project-row:focus-visible,
    .rail-project:focus-visible,
    .back-button:focus-visible,
    .nav-arrow:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .nav-index {
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 10px;
    }

    main {
      padding-block: 48px 72px;
    }

    .view {
      min-height: calc(100vh - var(--nav-height) - 120px);
    }

    .view.is-leaving {
      animation: leave 140ms ease-in forwards;
    }

    .view.is-entering {
      animation: enter 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes leave {
      to {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(280px, 0.7fr);
      gap: clamp(32px, 7vw, 100px);
      align-items: end;
      padding-block: 34px 52px;
      border-bottom: 1px solid var(--line-strong);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 24px;
      color: var(--brand);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 28px;
      height: 1px;
      content: "";
      background: currentColor;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .hero h1 {
      max-width: 760px;
      margin-bottom: 24px;
      font-family: var(--serif);
      font-size: clamp(56px, 8.2vw, 108px);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.045em;
    }

    .hero h1 span {
      display: block;
      color: var(--brand);
    }

    .hero-copy {
      max-width: 570px;
      margin-bottom: 0;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.85;
    }

    .hero-index {
      position: relative;
      min-height: 260px;
      padding: 24px 0 0 24px;
      border-left: 1px solid var(--line-strong);
    }

    .hero-index::before {
      position: absolute;
      top: 0;
      left: -4px;
      width: 7px;
      height: 7px;
      content: "";
      background: var(--accent);
      border-radius: 50%;
    }

    .hero-total {
      font-family: var(--serif);
      font-size: clamp(82px, 11vw, 142px);
      font-weight: 700;
      line-height: 0.82;
      letter-spacing: -0.06em;
    }

    .hero-total small {
      display: block;
      margin-top: 20px;
      color: var(--ink-soft);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .hero-metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px 20px;
      margin-top: 38px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .metric strong {
      display: block;
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 600;
    }

    .metric span {
      display: block;
      margin-top: 5px;
      color: var(--ink-faint);
      font-size: 11px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      margin: 58px 0 22px;
    }

    .section-heading h2 {
      margin-bottom: 0;
      font-family: var(--serif);
      font-size: clamp(28px, 3.5vw, 42px);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .section-note {
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .timeline {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      border-block: 1px solid var(--line-strong);
    }

    .timeline::before {
      position: absolute;
      top: 38px;
      right: 0;
      left: 0;
      height: 1px;
      content: "";
      background: var(--line);
    }

    .timeline-day {
      position: relative;
      min-height: 208px;
      padding: 24px 22px 24px 0;
      border-right: 1px solid var(--line);
    }

    .timeline-day:not(:first-child) {
      padding-left: 22px;
    }

    .timeline-day:last-child {
      border-right: 0;
    }

    .timeline-date {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding-right: 10px;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
    }

    .timeline-date::before {
      width: 7px;
      height: 7px;
      margin-right: 9px;
      content: "";
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 5px var(--paper);
    }

    .timeline-items {
      display: grid;
      gap: 16px;
      margin-top: 25px;
    }

    .timeline-item {
      display: block;
      padding: 0;
      color: inherit;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .timeline-item strong {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      transition: color 180ms ease;
    }

    .timeline-item span {
      display: block;
      color: var(--ink-soft);
      font-size: 11px;
      line-height: 1.65;
    }

    .timeline-item:hover strong {
      color: var(--brand);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .project-board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0;
      margin-top: 20px;
      border-top: 1px solid var(--line-strong);
    }

    .project-row {
      position: relative;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      min-height: 132px;
      padding: 24px 28px 24px 0;
      color: inherit;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 220ms ease, padding 220ms ease;
    }

    .project-row:nth-child(odd) {
      border-right: 1px solid var(--line);
    }

    .project-row:nth-child(even) {
      padding-left: 28px;
    }

    .project-row:hover {
      background: rgba(255, 255, 252, 0.62);
    }

    .project-number {
      align-self: start;
      padding-top: 5px;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 11px;
    }

    .project-summary {
      min-width: 0;
    }

    .project-summary h3 {
      margin-bottom: 11px;
      font-family: var(--serif);
      font-size: 23px;
      line-height: 1.2;
    }

    .project-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 14px;
      align-items: center;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.5;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .status::before {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      content: "";
      background: currentColor;
      border-radius: 50%;
    }

    .status.green {
      color: var(--brand);
    }

    .status.blue {
      color: var(--blue);
    }

    .status.amber {
      color: var(--amber);
    }

    .status.violet {
      color: var(--violet);
    }

    .status.olive {
      color: var(--olive);
    }

    .version {
      font-family: var(--mono);
      font-size: 10px;
    }

    .row-arrow {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      border-radius: 50%;
      transition: color 180ms ease, background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .row-arrow svg {
      width: 15px;
      height: 15px;
    }

    .project-row:hover .row-arrow {
      color: var(--white);
      background: var(--ink);
      border-color: var(--ink);
      transform: translateX(3px);
    }

    .detail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 35px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 0;
      color: var(--ink-soft);
      border: 0;
      background: transparent;
      font-size: 12px;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .back-button:hover {
      color: var(--ink);
    }

    .back-button svg,
    .nav-arrow svg {
      width: 15px;
      height: 15px;
    }

    .detail-controls {
      display: flex;
      gap: 8px;
    }

    .nav-arrow {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 252, 0.35);
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease, border-color 180ms ease;
    }

    .nav-arrow:hover {
      color: var(--white);
      background: var(--ink);
      border-color: var(--ink);
    }

    .project-detail {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(320px, 0.7fr);
      gap: clamp(42px, 8vw, 112px);
      align-items: start;
    }

    .detail-kicker {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .detail-kicker::after {
      width: 58px;
      height: 1px;
      content: "";
      background: var(--line-strong);
    }

    .project-detail h1 {
      max-width: 760px;
      margin-bottom: 26px;
      font-family: var(--serif);
      font-size: clamp(48px, 7vw, 90px);
      font-weight: 700;
      line-height: 1.03;
      letter-spacing: -0.045em;
    }

    .detail-status-line {
      display: flex;
      flex-wrap: wrap;
      gap: 13px 24px;
      align-items: center;
      margin-bottom: 38px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line-strong);
    }

    .detail-status-line .status {
      font-size: 12px;
    }

    .detail-version {
      color: var(--ink-soft);
      font-family: var(--mono);
      font-size: 11px;
    }

    .plan-block {
      position: relative;
      padding-left: 28px;
    }

    .plan-block::before {
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: 0;
      width: 2px;
      content: "";
      background: var(--accent);
    }

    .block-label {
      margin-bottom: 18px;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .plan-date {
      margin-bottom: 9px;
      font-family: var(--serif);
      font-size: clamp(25px, 3.2vw, 38px);
      font-weight: 700;
      line-height: 1.2;
    }

    .plan-task {
      max-width: 580px;
      margin-bottom: 0;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.85;
    }

    .entry-panel {
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: rgba(255, 255, 252, 0.5);
      box-shadow: var(--shadow);
    }

    .entry-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
    }

    .entry-panel-head h2 {
      margin-bottom: 0;
      font-family: var(--serif);
      font-size: 20px;
    }

    .entry-panel-head svg {
      width: 17px;
      height: 17px;
      color: var(--ink-faint);
    }

    .entry-group {
      padding: 22px;
      border-bottom: 1px solid var(--line);
    }

    .entry-group:last-child {
      border-bottom: 0;
    }

    .entry-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 11px;
      color: var(--ink-faint);
      font-size: 11px;
    }

    .entry-label svg {
      width: 13px;
      height: 13px;
    }

    .entry-link,
    .entry-empty {
      display: block;
      overflow-wrap: anywhere;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.7;
    }

    .entry-link {
      color: var(--brand-deep);
      text-decoration-color: rgba(13, 71, 62, 0.35);
      text-underline-offset: 4px;
      transition: color 180ms ease;
    }

    .entry-link:hover {
      color: var(--accent);
    }

    .entry-empty {
      color: var(--ink-faint);
    }

    .entry-note {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 17px 22px;
      color: var(--ink-faint);
      background: rgba(233, 236, 229, 0.55);
      font-size: 10px;
      line-height: 1.65;
    }

    .entry-note svg {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      margin-top: 1px;
    }

    .mobile-project-count {
      display: none;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 10px;
      white-space: nowrap;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-top: 76px;
      padding-top: 21px;
      color: var(--ink-faint);
      border-top: 1px solid var(--line-strong);
      font-size: 10px;
      line-height: 1.6;
    }

    .footer span:last-child {
      font-family: var(--mono);
      letter-spacing: 0.06em;
    }

    .project-rail {
      display: none;
    }

    @media (max-width: 1080px) {
      .shell {
        width: min(100% - 48px, 960px);
      }

      .brand-name span {
        display: none;
      }

      .topbar-inner {
        gap: 16px;
      }

      .hero {
        grid-template-columns: minmax(0, 1fr) 250px;
        gap: 32px;
      }

      .timeline {
        grid-template-columns: repeat(5, minmax(180px, 1fr));
        overflow-x: auto;
      }

      .project-detail {
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 42px;
      }
    }

    @media (max-width: 760px) {
      :root {
        --nav-height: 64px;
      }

      .shell {
        width: min(100% - 32px, 680px);
      }

      .topbar-inner {
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 31px;
        height: 31px;
      }

      .brand-name {
        display: none;
      }

      .nav-rail {
        gap: 2px;
        padding: 4px;
        border-radius: 10px;
      }

      .nav-item {
        padding: 8px 10px;
        font-size: 12px;
      }

      .mobile-project-count {
        display: block;
      }

      main {
        padding-block: 26px 48px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 42px;
        padding-block: 22px 38px;
      }

      .eyebrow {
        margin-bottom: 18px;
      }

      .hero h1 {
        margin-bottom: 20px;
        font-size: clamp(52px, 18vw, 78px);
        letter-spacing: -0.055em;
      }

      .hero-index {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0 26px;
        min-height: 0;
        padding: 22px 0 0 20px;
      }

      .hero-total {
        font-size: 82px;
      }

      .hero-total small {
        margin-top: 12px;
      }

      .hero-metrics {
        align-self: end;
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }

      .section-heading {
        align-items: flex-end;
        margin-top: 42px;
      }

      .timeline {
        grid-template-columns: 1fr;
        border-bottom: 0;
      }

      .timeline::before {
        top: 0;
        bottom: 0;
        left: 3px;
        width: 1px;
        height: auto;
      }

      .timeline-day,
      .timeline-day:not(:first-child) {
        min-height: 0;
        padding: 20px 0 20px 26px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .timeline-date {
        padding-right: 10px;
      }

      .timeline-date::before {
        position: absolute;
        left: -26px;
        margin-right: 0;
      }

      .timeline-items {
        margin-top: 14px;
        padding-left: 0;
      }

      .project-board {
        grid-template-columns: 1fr;
      }

      .project-row,
      .project-row:nth-child(even) {
        min-height: 118px;
        padding: 21px 0;
        border-right: 0;
      }

      .project-detail {
        grid-template-columns: 1fr;
        gap: 42px;
      }

      .detail-top {
        margin-bottom: 26px;
      }

      .project-detail h1 {
        font-size: clamp(46px, 15vw, 68px);
      }

      .detail-status-line {
        margin-bottom: 30px;
      }

      .entry-panel {
        border-radius: 14px;
      }

      .footer {
        flex-direction: column;
        gap: 7px;
        margin-top: 50px;
      }
    }

    @media (max-width: 430px) {
      .shell {
        width: calc(100% - 24px);
      }

      .nav-item {
        padding-inline: 9px;
        font-size: 11px;
      }

      .hero-copy {
        font-size: 14px;
      }

      .hero-index {
        grid-template-columns: 1fr;
      }

      .hero-metrics {
        margin-top: 24px;
        padding-top: 17px;
        border-top: 1px solid var(--line);
      }

      .section-heading {
        display: block;
      }

      .section-note {
        display: block;
        margin-top: 10px;
      }

      .project-row {
        grid-template-columns: 30px minmax(0, 1fr) 30px;
        gap: 8px;
      }

      .project-summary h3 {
        font-size: 20px;
      }

      .row-arrow {
        width: 30px;
        height: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="#overview" data-route="overview" aria-label="返回开发计划总览">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19V5"></path>
            <path d="M4 19h16"></path>
            <path d="m7 15 3-4 3 2 4-6"></path>
          </svg>
        </span>
        <span class="brand-name">
          <strong>开发计划</strong>
          <span>Project Status</span>
        </span>
      </a>

      <nav class="nav-rail" aria-label="项目分类导航">
        <button class="nav-item" type="button" data-route="overview" aria-current="page">
          <span class="nav-index">00</span>&nbsp; 总览
        </button>
        <button class="nav-item" type="button" data-route="traceability"><span class="nav-index">01</span>&nbsp; 溯源管理系统</button>
        <button class="nav-item" type="button" data-route="website"><span class="nav-index">02</span>&nbsp; 官网</button>
        <button class="nav-item" type="button" data-route="admin"><span class="nav-index">03</span>&nbsp; 后台管理系统</button>
        <button class="nav-item" type="button" data-route="application"><span class="nav-index">04</span>&nbsp; 应用程序</button>
        <button class="nav-item" type="button" data-route="recruitment"><span class="nav-index">05</span>&nbsp; 招聘系统</button>
        <button class="nav-item" type="button" data-route="qinghuan"><span class="nav-index">06</span>&nbsp; 清欢内测</button>
        <button class="nav-item" type="button" data-route="local-model"><span class="nav-index">07</span>&nbsp; 本地大模型</button>
        <button class="nav-item" type="button" data-route="unnamed"><span class="nav-index">08</span>&nbsp; 《未命名》</button>
      </nav>

      <span class="mobile-project-count" aria-hidden="true">08 项</span>
    </div>
  </header>

  <main id="main-content">
    <div class="shell">
      <div id="view-root" class="view" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const projects = [
      {
        id: "traceability",
        name: "溯源管理系统",
        status: "高频维护中",
        tone: "green",
        version: "v1.6正式版",
        access: "https://www.jys-headward.com/trace/72992391731",
        docs: null,
        planDate: "2026年11月19日",
        planTask: "逐步替换图片并加入视频"
      },
      {
        id: "website",
        name: "官网",
        status: "开发设计中",
        tone: "blue",
        version: "v0.3开发版",
        access: null,
        docs: null,
        planDate: "2026年11月19日",
        planTask: "开一版可交互版本出来"
      },
      {
        id: "admin",
        name: "后台管理系统",
        status: "低频维护中",
        tone: "olive",
        version: "v1.0正式版",
        access: "http://183.222.240.142:729",
        docs: null,
        planDate: "2026年12月3日",
        planTask: "测试团队功能"
      },
      {
        id: "application",
        name: "应用程序",
        status: "开发设计中",
        tone: "blue",
        version: "v0.10开发版",
        access: null,
        docs: "http://192.168.31.87:4173/",
        planDate: "2026年11月13日",
        planTask: "休假时间统计功能"
      },
      {
        id: "recruitment",
        name: "招聘系统",
        status: "测试中",
        tone: "amber",
        version: "v0.1开发版",
        access: "http://192.168.31.87:8765/",
        docs: null,
        planDate: "2026年11月19日",
        planTask: "逐步添加其余学校信息"
      },
      {
        id: "qinghuan",
        name: "清欢内测",
        status: "中频维护中",
        tone: "green",
        version: "v0.6测试版",
        access: "https://www.jys-manage.com",
        docs: "https://monumental-yeot-866d58.netlify.app/#/",
        planDate: "2026年12月3日",
        planTask: "ai功能性引入"
      },
      {
        id: "local-model",
        name: "本地大模型",
        status: "开发测试中",
        tone: "violet",
        version: "v0.1测试版",
        access: "http://192.168.31.202:8000/",
        docs: null,
        planDate: "2026年11月12日",
        planTask: "继续完善文档资料"
      },
      {
        id: "unnamed",
        name: "《未命名》",
        status: "主体设计中",
        tone: "violet",
        version: "v0.1开发版",
        access: null,
        docs: null,
        planDate: "2026年11月12日",
        planTask: "主体方向构思，开始着手策划案"
      }
    ];

    const timeline = [
      {
        label: "11.12",
        items: [
          { id: "local-model", name: "本地大模型", task: "继续完善文档资料" },
          { id: "unnamed", name: "《未命名》", task: "主体方向构思，开始着手策划案" }
        ]
      },
      {
        label: "11.13",
        items: [
          { id: "application", name: "应用程序", task: "休假时间统计功能" }
        ]
      },
      {
        label: "11.19",
        items: [
          { id: "traceability", name: "溯源管理系统", task: "逐步替换图片并加入视频" },
          { id: "website", name: "官网", task: "开一版可交互版本出来" },
          { id: "recruitment", name: "招聘系统", task: "逐步添加其余学校信息" }
        ]
      },
      {
        label: "12.03",
        items: [
          { id: "admin", name: "后台管理系统", task: "测试团队功能" },
          { id: "qinghuan", name: "清欢内测", task: "ai功能性引入" }
        ]
      }
    ];

    const arrowRight = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path>
      </svg>`;

    const arrowLeft = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"></path><path d="m11 18-6-6 6-6"></path>
      </svg>`;

    const arrowUpRight = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 17 17 7"></path><path d="M7 7h10v10"></path>
      </svg>`;

    const linkIcon = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
      </svg>`;

    const fileIcon = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <path d="M14 2v6h6"></path>
      </svg>`;

    const infoIcon = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path>
      </svg>`;

    const root = document.getElementById("view-root");
    const navItems = [...document.querySelectorAll(".nav-item")];
    const routeIds = ["overview", ...projects.map((project) => project.id)];
    let currentRoute = null;
    let transitionToken = 0;

    function statusMarkup(project) {
      return `<span class="status ${project.tone}">${project.status}</span>`;
    }

    function entryMarkup(value, kind) {
      const label = kind === "access" ? "访问入口" : "文档入口";
      const icon = kind === "access" ? arrowUpRight : fileIcon;
      if (!value) {
        return `
          <div class="entry-group">
            <div class="entry-label">${icon}${label}</div>
            <span class="entry-empty">无</span>
          </div>`;
      }
      return `
        <div class="entry-group">
          <div class="entry-label">${icon}${label}</div>
          <a class="entry-link" href="${value}" target="_blank" rel="noreferrer">${value}</a>
        </div>`;
    }

    function overviewMarkup() {
      const timelineMarkup = timeline.map((day) => `
        <div class="timeline-day">
          <span class="timeline-date">${day.label}</span>
          <div class="timeline-items">
            ${day.items.map((item) => `
              <button class="timeline-item" type="button" data-route="${item.id}">
                <strong>${item.name}</strong>
                <span>${item.task}</span>
              </button>
            `).join("")}
          </div>
        </div>
      `).join("");

      const projectRows = projects.map((project, index) => `
        <button class="project-row" type="button" data-route="${project.id}" aria-label="查看${project.name}详情">
          <span class="project-number">${String(index + 1).padStart(2, "0")}</span>
          <span class="project-summary">
            <h3>${project.name}</h3>
            <span class="project-meta">
              ${statusMarkup(project)}
              <span class="version">${project.version}</span>
            </span>
          </span>
          <span class="row-arrow" aria-hidden="true">${arrowRight}</span>
        </button>
      `).join("");

      return `
        <section aria-labelledby="overview-title">
          <div class="hero">
            <div>
              <p class="eyebrow">项目进度 / 近期节点</p>
              <h1 id="overview-title">开发<span>计划</span></h1>
              <p class="hero-copy">集中查看 8 个项目的当前状态、版本、入口与下阶段规划。</p>
            </div>
            <aside class="hero-index" aria-label="项目概况">
              <div class="hero-total">08<small>个项目</small></div>
              <div class="hero-metrics">
                <div class="metric"><strong>4</strong><span>个计划日期</span></div>
                <div class="metric"><strong>5</strong><span>个对外入口</span></div>
              </div>
            </aside>
          </div>

          <div class="section-heading">
            <h2>近期节点</h2>
            <span class="section-note">按日期由近至远</span>
          </div>
          <div class="timeline">${timelineMarkup}</div>

          <div class="section-heading">
            <h2>全部项目</h2>
            <span class="section-note">选择项目查看详情</span>
          </div>
          <div class="project-board">${projectRows}</div>
        </section>
        ${footerMarkup()}
      `;
    }

    function detailMarkup(project) {
      const index = projects.findIndex((item) => item.id === project.id);
      const previous = projects[(index - 1 + projects.length) % projects.length];
      const next = projects[(index + 1) % projects.length];

      return `
        <article class="project-detail" aria-labelledby="project-title">
          <div>
            <div class="detail-top">
              <button class="back-button" type="button" data-route="overview">
                ${arrowLeft} 返回总览
              </button>
              <div class="detail-controls">
                <button class="nav-arrow" type="button" data-route="${previous.id}" aria-label="上一个项目：${previous.name}" title="上一个项目">
                  ${arrowLeft}
                </button>
                <button class="nav-arrow" type="button" data-route="${next.id}" aria-label="下一个项目：${next.name}" title="下一个项目">
                  ${arrowRight}
                </button>
              </div>
            </div>

            <div class="detail-kicker">项目 ${String(index + 1).padStart(2, "0")} / 08</div>
            <h1 id="project-title">${project.name}</h1>
            <div class="detail-status-line">
              ${statusMarkup(project)}
              <span class="detail-version">${project.version}</span>
            </div>

            <div class="plan-block">
              <div class="block-label">下阶段规划</div>
              <div class="plan-date">${project.planDate}</div>
              <p class="plan-task">${project.planTask}</p>
            </div>
          </div>

          <aside class="entry-panel" aria-label="项目入口">
            <div class="entry-panel-head">
              <h2>项目入口</h2>
              ${linkIcon}
            </div>
            ${entryMarkup(project.access, "access")}
            ${entryMarkup(project.docs, "docs")}
            <div class="entry-note">
              ${infoIcon}
              <span>入口地址按文档内容原样呈现。</span>
            </div>
          </aside>
        </article>
        ${footerMarkup()}
      `;
    }

    function footerMarkup() {
      return `
        <footer class="footer">
          <span>开发计划 · 项目进度</span>
          <span>8 PROJECTS</span>
        </footer>
      `;
    }

    function updateNavigation(route) {
      navItems.forEach((item) => {
        if (item.dataset.route === route) {
          item.setAttribute("aria-current", "page");
          item.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
        } else {
          item.removeAttribute("aria-current");
        }
      });
    }

    function render(route, options = {}) {
      const targetProject = projects.find((project) => project.id === route);
      const resolvedRoute = targetProject ? route : "overview";
      if (resolvedRoute === currentRoute && !options.force) {
        return;
      }

      const renderToken = ++transitionToken;
      const performRender = () => {
        if (renderToken !== transitionToken) return;
        root.innerHTML = targetProject ? detailMarkup(targetProject) : overviewMarkup();
        currentRoute = resolvedRoute;
        updateNavigation(resolvedRoute);
        root.classList.remove("is-leaving");
        root.classList.add("is-entering");
        window.setTimeout(() => root.classList.remove("is-entering"), 440);
        if (options.scroll !== false) {
          window.scrollTo({ top: 0, behavior: "instant" });
        }
        if (resolvedRoute !== "overview") {
          document.title = `${targetProject.name} · 开发计划`;
        } else {
          document.title = "开发计划 · 项目进度";
        }
      };

      if (currentRoute === null || options.immediate || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        performRender();
        return;
      }

      root.classList.remove("is-entering");
      root.classList.add("is-leaving");
      window.setTimeout(performRender, 135);
    }

    function navigate(route, options = {}) {
      const resolvedRoute = routeIds.includes(route) ? route : "overview";
      if (location.hash !== `#${resolvedRoute}`) {
        history.pushState(null, "", `#${resolvedRoute}`);
      }
      render(resolvedRoute, options);
    }

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-route]");
      if (!trigger) return;
      event.preventDefault();
      navigate(trigger.dataset.route);
    });

    window.addEventListener("popstate", () => {
      render(location.hash.slice(1) || "overview", { immediate: true });
    });

    document.addEventListener("keydown", (event) => {
      if (event.target.matches("input, textarea, select")) return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      if (!projects.some((project) => project.id === currentRoute)) return;
      event.preventDefault();
      const index = projects.findIndex((project) => project.id === currentRoute);
      const offset = event.key === "ArrowRight" ? 1 : -1;
      const nextProject = projects[(index + offset + projects.length) % projects.length];
      navigate(nextProject.id);
    });

    render(location.hash.slice(1) || "overview", { immediate: true });
  </script>
</body>
</html>
